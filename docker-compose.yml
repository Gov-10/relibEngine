name: relib-engine

networks:
  relib-net:
    driver: bridge

volumes:
  auth_db_data:
  scenario_store_data:
  trace_store_data:
  temporal_db_data:
  kafka_data:

services:
  # ---------------------------------------------------------------------------
  # DATA STORES (PostgreSQL everywhere, per TECH_STACK.md)
  # ---------------------------------------------------------------------------

  auth-db:
    image: postgres:16-alpine
    container_name: relib-auth-db
    environment:
      POSTGRES_USER: auth
      POSTGRES_PASSWORD: auth_dev_password
      POSTGRES_DB: auth_db
    ports:
      - "15432:5432"
    volumes:
      - auth_db_data:/var/lib/postgresql/data
    networks:
      - relib-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U auth -d auth_db"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  scenario-store:
    image: postgres:16-alpine
    container_name: relib-scenario-store
    environment:
      POSTGRES_USER: scenario
      POSTGRES_PASSWORD: scenario_dev_password
      POSTGRES_DB: scenario_store
    ports:
      - "15433:5432"
    volumes:
      - scenario_store_data:/var/lib/postgresql/data
    networks:
      - relib-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U scenario -d scenario_store"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  trace-store:
    image: postgres:16-alpine
    container_name: relib-trace-store
    environment:
      POSTGRES_USER: trace
      POSTGRES_PASSWORD: trace_dev_password
      POSTGRES_DB: trace_store
    ports:
      - "15434:5432"
    volumes:
      - trace_store_data:/var/lib/postgresql/data
    networks:
      - relib-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U trace -d trace_store"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # ---------------------------------------------------------------------------
  # MESSAGE QUEUE (single Apache Kafka cluster hosting BOTH architecture topics)
  #   Topic A: scenario-jobs    Topic B: analysis-events
  # ---------------------------------------------------------------------------

  message-queue:
    image: apache/kafka:4.3.1
    container_name: relib-mq
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@message-queue:9093
      KAFKA_LISTENERS: INTERNAL://0.0.0.0:29092,CONTROLLER://0.0.0.0:9093,EXTERNAL://0.0.0.0:9092
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://message-queue:29092,EXTERNAL://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_NUM_PARTITIONS: 3
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_LOG_DIRS: /var/lib/kafka/data
      KAFKA_CLUSTER_ID: 5L6g3nShT-eMCtK--X86sw
    volumes:
      - kafka_data:/var/lib/kafka/data
    networks:
      - relib-net
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:29092"]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 20s
    restart: unless-stopped

  message-queue-init:
    image: apache/kafka:4.3.1
    container_name: relib-mq-init
    depends_on:
      message-queue:
        condition: service_healthy
    entrypoint: ["/bin/bash", "-c"]
    command:
      - >
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server message-queue:29092
        --create --if-not-exists --topic scenario-jobs
        --partitions 3 --replication-factor 1 &&
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server message-queue:29092
        --create --if-not-exists --topic analysis-events
        --partitions 3 --replication-factor 1
    networks:
      - relib-net
    restart: "no"

  # ---------------------------------------------------------------------------
  # TEMPORAL (workflow orchestrator used by Agent Runner & Planner)
  # ---------------------------------------------------------------------------

  temporal-db:
    image: postgres:16-alpine
    container_name: relib-temporal-db
    environment:
      POSTGRES_USER: temporal
      POSTGRES_PASSWORD: temporal
      POSTGRES_DB: temporal
    volumes:
      - temporal_db_data:/var/lib/postgresql/data
    networks:
      - relib-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U temporal -d temporal"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  temporal:
    image: temporalio/auto-setup:1.29.7
    container_name: relib-temporal
    depends_on:
      temporal-db:
        condition: service_healthy
    environment:
      DB: postgres12
      DB_PORT: 5432
      POSTGRES_SEEDS: temporal-db
      POSTGRES_USER: temporal
      POSTGRES_PWD: temporal
      POSTGRES_DB: temporal
      SKIP_DEFAULT_NAMESPACE_CREATION: "false"
      DEFAULT_NAMESPACE: relib-engine
      DEFAULT_NAMESPACE_RETENTION: 24h
    ports:
      - "7233:7233"
    networks:
      - relib-net
    healthcheck:
      test: ["CMD", "bash", "-c", "echo > /dev/tcp/$(hostname -i | awk '{print $1}')/7233"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 60s
    restart: unless-stopped

  temporal-ui:
    image: temporalio/ui:2.53.3
    container_name: relib-temporal-ui
    depends_on:
      temporal:
        condition: service_healthy
    environment:
      TEMPORAL_ADDRESS: temporal:7233
      TEMPORAL_UI_ENABLED: "true"
    ports:
      - "8088:8080"
    networks:
      - relib-net
    restart: unless-stopped

  # ---------------------------------------------------------------------------
  # API GATEWAY (Kong, DB-less declarative mode via kong.yml)
  # ---------------------------------------------------------------------------

  gateway:
    image: kong:3.9
    container_name: relib-gateway
    environment:
      KONG_DATABASE: "off"
      KONG_DECLARATIVE_CONFIG: /kong/declarative/kong.yml
      KONG_PROXY_ACCESS_LOG: /dev/stdout
      KONG_ADMIN_ACCESS_LOG: /dev/stdout
      KONG_PROXY_ERROR_LOG: /dev/stderr
      KONG_ADMIN_ERROR_LOG: /dev/stderr
      KONG_ADMIN_LISTEN: 0.0.0.0:8001
    ports:
      - "8000:8000"
      - "8001:8001"
    volumes:
      - ./gateway/kong.yml:/kong/declarative/kong.yml:ro
    networks:
      - relib-net
    restart: unless-stopped
